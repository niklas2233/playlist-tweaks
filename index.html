<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Playlist Order</title>
<meta name="darkreader-lock"><!-- page is already dark; stop Dark Reader double-darkening it -->
<style>
  :root { color-scheme: dark; --bg: #0f0f0f; --panel: #1a1a1a; --hover: #262626; --line: #303030; --text: #e8e8e8; --dim: #9a9a9a; --accent: #3ea6ff; --control: #383838; --control-hover: #444; --control-line: #555; }
  html { background: var(--bg); }
  body { font: 14px/1.4 system-ui, sans-serif; max-width: 1400px; margin: 0 auto; padding: 16px; color: var(--text); }
  form, .bar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  input, select, button { font: inherit; color: var(--text); background: var(--control); border: 1px solid var(--control-line); border-radius: 8px; padding: 8px 12px; }
  input { flex: 1; min-width: 200px; }
  input::placeholder { color: var(--dim); }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  button, select { cursor: pointer; }
  button:hover, select:hover { background: var(--control-hover); }
  #load button, #play { background: #525252; border-color: #666; font-weight: 600; }
  #load button:hover, #play:hover { background: #5e5e5e; }
  #wrap { display: grid; grid-template-columns: 1fr 400px; gap: 16px; }
  @media (max-width: 850px) { #wrap { grid-template-columns: 1fr; } }
  #player { width: 100%; aspect-ratio: 16/9; height: auto; border-radius: 12px; background: #000; display: block; }
  #stage { position: relative; }
  #exit { display: none; position: absolute; top: 8px; right: 8px; z-index: 1; opacity: .6; }
  #exit:hover { opacity: 1; }
  body.fill { overflow: hidden; }
  body.fill #stage { position: fixed; inset: 0; z-index: 9; background: #000; }
  body.fill #player { height: 100%; aspect-ratio: auto; border-radius: 0; }
  body.fill #exit { display: block; }
  ol { list-style: none; padding: 4px; margin: 0; max-height: 75vh; overflow: auto; background: var(--panel); border-radius: 12px; }
  ol:empty { display: none; }
  li { display: flex; gap: 8px; align-items: center; padding: 6px; border-radius: 8px; cursor: grab; }
  li:hover { background: var(--hover); }
  li.playing { background: #263850; }
  li.drag { opacity: .4; }
  li b { width: 2.2em; text-align: right; color: var(--dim); font-weight: 400; font-size: 12px; }
  li img { width: 96px; aspect-ratio: 16/9; object-fit: cover; cursor: pointer; border-radius: 6px; }
  li span { flex: 1; font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  li button { padding: 2px 6px; background: none; border-color: transparent; color: var(--dim); }
  li button:hover { color: var(--text); background: var(--line); }
</style>
</head>
<body>
<form id="load">
  <input id="url" placeholder="Paste a YouTube playlist URL or ID" required>
  <button>Load</button>
</form>
<div class="bar">
  <button id="play">▶ Play in this order</button>
  <select id="sort" aria-label="Sort order">
    <option value="default">Default order</option>
    <option value="title">Title (A–Z)</option>
    <option value="newest">Upload date (newest)</option>
    <option value="oldest">Upload date (oldest)</option>
    <option value="shuffle">Shuffle</option>
    <option value="custom" hidden>Custom order</option>
  </select>
  <button id="reverse">Reverse</button>
  <button id="fill" title="Fill the browser window (Esc to exit)">⛶ Fill window</button>
  <input id="key" placeholder="YouTube API key (only needed for upload date)">
</div>
<div id="wrap">
  <div id="stage"><button id="exit" title="Exit (Esc)">✕</button><div id="player"></div></div>
  <ol id="list"></ol>
</div>
<div id="resolver" hidden></div>

<script>
let player, resolver, resume, listId, ids = [], original = [];
const titles = {};
const $ = s => document.querySelector(s);

const tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
document.head.append(tag);

function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', { events: { onStateChange: onState } });
  // hidden second player that only turns a playlist ID into its video IDs. Cueing a list ID on the visible
  // player makes it re-apply YouTube's order a second or so later, clobbering ours.
  resolver = new YT.Player('resolver');
}

$('#load').onsubmit = e => {
  e.preventDefault();
  const v = $('#url').value.trim();
  try { listId = new URL(v).searchParams.get('list') || v; } catch { listId = v; }
  // ponytail: let the embedded player resolve the playlist, no API key needed. YouTube caps this at ~200 videos.
  resolver.cuePlaylist({ list: listId, listType: 'playlist' });
  let tries = 0;
  const poll = setInterval(() => {
    // skip the previous playlist's list while the new one loads; getPlaylistId isn't documented, so fall back if it disappears
    const got = (resolver.getPlaylistId?.() ?? listId) === listId && resolver.getPlaylist();
    if (got?.length || ++tries > 40) {
      clearInterval(poll);
      if (!got?.length) return alert('Could not load that playlist (private, or bad ID?)');
      original = got.slice();
      let saved = null, pos = null;
      try {
        saved = JSON.parse(localStorage.getItem('order:' + listId));
        pos = JSON.parse(localStorage.getItem('pos:' + listId));
        localStorage.setItem('lastUrl', v);
      } catch {}
      // keep saved order only if it is still the same set of videos
      const keep = saved && saved.length === got.length && saved.every(id => got.includes(id));
      ids = keep ? saved : got.slice();
      $('#sort').value = keep && saved.join() !== got.join() ? 'custom' : 'default';
      // cue our order at the video and time we left off; a removed video just starts from the top
      const at = ids.indexOf(pos?.id);
      resume = at < 0 ? null : pos;
      player.cuePlaylist({ playlist: ids, index: Math.max(0, at), startSeconds: resume?.t || 0 });
      render();
    }
  }, 250);
};

function save() {
  try { localStorage.setItem('order:' + listId, JSON.stringify(ids)); } catch {}
}

function render() {
  const ol = $('#list');
  ol.innerHTML = '';
  ids.forEach((id, i) => {
    const li = document.createElement('li');
    li.draggable = true;
    li.dataset.id = id;
    li.innerHTML = `<b>${i + 1}</b><img src="https://i.ytimg.com/vi/${id}/mqdefault.jpg" alt="" title="Play from here">
      <span></span><button title="Move up">▲</button><button title="Move down">▼</button>`;
    li.querySelector('span').textContent = titles[id] || id;
    li.querySelector('img').onclick = () => play(i);
    const [up, down] = li.querySelectorAll('button');
    up.onclick = () => move(i, i - 1);
    down.onclick = () => move(i, i + 1);
    li.ondragstart = e => { e.dataTransfer.setData('text/plain', i); li.classList.add('drag'); };
    li.ondragend = () => li.classList.remove('drag');
    li.ondragover = e => e.preventDefault();
    li.ondrop = e => { e.preventDefault(); move(+e.dataTransfer.getData('text/plain'), i); };
    ol.append(li);
    if (!titles[id]) fetchTitle(id);
  });
  highlight();
}

function fetchTitle(id) {
  titles[id] = id; // mark as in-flight
  fetch('https://noembed.com/embed?url=https://www.youtube.com/watch?v=' + id)
    .then(r => r.json())
    .then(d => {
      if (!d.title) return;
      titles[id] = d.title;
      const span = document.querySelector(`li[data-id="${id}"] span`);
      if (span) span.textContent = d.title;
    })
    .catch(() => {});
}

function move(from, to) {
  if (to < 0 || to >= ids.length || from === to) return;
  ids.splice(to, 0, ids.splice(from, 1)[0]);
  $('#sort').value = 'custom';
  save();
  render();
}

function play(i = 0) {
  if (ids.length) player.loadPlaylist({ playlist: ids, index: i });
}

// a freshly created player honours startSeconds while cued but restarts from 0 on the first play,
// so seek again once the resumed video actually starts
function onState(e) {
  if (e.data === YT.PlayerState.PLAYING && resume) {
    if (currentId() === resume.id && player.getCurrentTime() < resume.t - 2) player.seekTo(resume.t, true);
    resume = null;
  }
  highlight();
}

const currentId = () => player?.getVideoUrl?.().match(/v=([\w-]{11})/)?.[1];

// remember where we are in this playlist: video id (not index, so reordering doesn't break it) + time
// only while playing/paused: a cued-but-unstarted player reports 0s and would wipe the saved spot
function savePos() {
  const id = currentId(), s = player?.getPlayerState?.();
  if (listId && ids.includes(id) && (s === YT.PlayerState.PLAYING || s === YT.PlayerState.PAUSED)) {
    try { localStorage.setItem('pos:' + listId, JSON.stringify({ id, t: Math.floor(player.getCurrentTime()) })); } catch {}
  }
}
setInterval(savePos, 5000);
addEventListener('pagehide', savePos);
try { $('#url').value = localStorage.getItem('lastUrl') || ''; } catch {}

function highlight() {
  const cur = currentId();
  document.querySelectorAll('#list li').forEach(li => li.classList.toggle('playing', li.dataset.id === cur));
}

$('#play').onclick = () => play();

$('#fill').onclick = $('#exit').onclick = () => document.body.classList.toggle('fill');
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.body.classList.remove('fill'); });

// YouTube-style hotkeys for when the page (not the iframe) has focus
const seek = s => player.seekTo(Math.max(0, player.getCurrentTime() + s), true);
const toggle = () => player.getPlayerState() === YT.PlayerState.PLAYING ? player.pauseVideo() : player.playVideo();
const volume = d => { player.unMute(); player.setVolume(Math.min(100, Math.max(0, player.getVolume() + d))); };
const speed = d => {
  const r = player.getAvailablePlaybackRates(), i = r.indexOf(player.getPlaybackRate()) + d;
  if (r[i]) player.setPlaybackRate(r[i]);
};
// frame step only while paused, like YouTube; ponytail: assumes 30fps, the API doesn't expose the real rate
const frame = d => { if (player.getPlayerState() !== YT.PlayerState.PLAYING) seek(d / 30); };
const keys = {
  j: () => seek(-10), l: () => seek(10), k: toggle, ' ': toggle,
  ArrowLeft: () => seek(-5), ArrowRight: () => seek(5),
  ArrowUp: () => volume(5), ArrowDown: () => volume(-5),
  m: () => player.isMuted() ? player.unMute() : player.mute(),
  f: () => document.body.classList.toggle('fill'),
  n: () => player.nextVideo(), p: () => player.previousVideo(),
  '<': () => speed(-1), '>': () => speed(1), ',': () => frame(-1), '.': () => frame(1),
  Home: () => player.seekTo(0, true), End: () => player.seekTo(player.getDuration(), true),
};
// 0–9 jump to 0%–90% of the video
for (let d = 0; d < 10; d++) keys[d] = () => player.seekTo(player.getDuration() * d / 10, true);
document.addEventListener('keydown', e => {
  const f = keys[e.key.length === 1 ? e.key.toLowerCase() : e.key];
  if (!f || !player?.seekTo || e.ctrlKey || e.altKey || e.metaKey || e.target.closest('input, select')) return;
  e.preventDefault();
  f();
});
// clicking the video focuses the YouTube iframe, which swallows Esc; pull focus back while filling.
// The hotkeys above stand in for YouTube's own, which stop working once focus is pulled out of the iframe.
window.addEventListener('blur', () => setTimeout(() => {
  if (document.body.classList.contains('fill')) document.activeElement?.blur();
}));
$('#reverse').onclick = () => { ids.reverse(); $('#sort').value = 'custom'; save(); render(); };

const dates = {};
try { $('#key').value = localStorage.getItem('ytkey') || ''; } catch {}
$('#key').oninput = () => { try { localStorage.setItem('ytkey', $('#key').value.trim()); } catch {} };

// upload dates aren't exposed by the embed player or oEmbed, so this needs the Data API
async function fetchDates() {
  const key = $('#key').value.trim();
  if (!key) { alert('Sorting by upload date needs a YouTube Data API key (free from Google Cloud Console).'); return false; }
  try { localStorage.setItem('ytkey', key); } catch {}
  const missing = original.filter(id => !dates[id]);
  for (let i = 0; i < missing.length; i += 50) {
    const url = `https://www.googleapis.com/youtube/v3/videos?part=snippet&key=${encodeURIComponent(key)}&id=${missing.slice(i, i + 50).join()}`;
    const r = await fetch(url).then(r => r.json()).catch(e => ({ error: e }));
    if (r.error) { alert('YouTube API error: ' + r.error.message); return false; }
    r.items.forEach(v => { dates[v.id] = v.snippet.publishedAt; titles[v.id] = v.snippet.title; });
  }
  return true;
}

$('#sort').onchange = async () => {
  const s = $('#sort').value;
  if (s === 'default') ids = original.slice();
  else if (s === 'title') ids.sort((a, b) => (titles[a] || a).localeCompare(titles[b] || b));
  else if (s === 'shuffle') {
    for (let i = ids.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [ids[i], ids[j]] = [ids[j], ids[i]];
    }
  } else {
    if (!await fetchDates()) return;
    const dir = s === 'newest' ? -1 : 1;
    // ISO timestamps sort as strings; deleted/private videos have no date and end up first/last
    ids.sort((a, b) => (dates[a] || '').localeCompare(dates[b] || '') * dir);
  }
  save(); render();
};
</script>
</body>
</html>
